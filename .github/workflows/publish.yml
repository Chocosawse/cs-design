# Publishes com.chocosawse:design to GitHub Packages when a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
# Runs on macOS because the iOS artifacts can only be built there.
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew :design:allTests

      - name: Publish
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository -Pversion="${GITHUB_REF_NAME#v}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
